name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Debug - List files
        run: |
          echo "=== Repository structure ==="
          ls -la
          echo "=== Themes ==="
          ls -la themes/
          echo "=== PaperMod ==="
          ls -la themes/PaperMod/ || echo "PaperMod not found"
          echo "=== Layouts ==="
          ls -la themes/PaperMod/layouts/ || echo "layouts not found"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: 'latest'
          extended: true

      - name: Debug - Hugo version
        run: hugo version

      - name: Build Hugo site
        run: hugo --minify --baseURL "https://maenza.github.io/avvocatomaenza-hugo/" --verbose

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy Hugo site - ${{ github.event.head_commit.message }}'
